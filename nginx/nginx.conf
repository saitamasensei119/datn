events {
    worker_connections 1024;
}

http {
    # Tạo vùng nhớ 10MB lưu trữ IP, giới hạn tối đa 5 request / giây cho mỗi IP
    limit_req_zone $binary_remote_addr zone=enroll_spam_limit:10m rate=5r/s;

    upstream spring_backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Áp dụng Rate Limit riêng cho API Đăng ký học phần (và Async Admin)
        location /api/student/enrollments {
            # burst=5: cho phép bùng nổ tạm thời 5 request đầu, nodelay: vượt ngưỡng trả về lỗi ngay lập tức
            limit_req zone=enroll_spam_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Các request API khác đi qua bình thường không bị giới hạn 5r/s
        location / {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
