spring.datasource.url=jdbc:postgresql://localhost:5432/DATN
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=none

# application.properties (default / production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# JWT Configuration (Dual Token & Secure Secret)
jwt.secret=${JWT_SECRET:8f3c7a2b9e1d4f6a0c5b8e3d2a1f4c7b9e0d3a2f5c8b1e4d7a0f3c6b9e2d5a8f}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000
jwt.expiration=900000

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JDBC Batch Configuration (Toi uu I/O)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest